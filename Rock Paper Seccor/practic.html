<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="practice.css">
</head>
<body>

  <!-- HEADER NAVBAR -->
  <header class="navbar">
    <h1>Rock paper scissors</h1>
  </header>

  <main class="game-container">
    
    <!-- CHOICES ROW -->
    <div class="choices-container">
      <button class="choice-btn" id="paper" aria-label="Paper">
        <span class="emoji-icon">✋</span>
      </button>
      <button class="choice-btn" id="scissors" aria-label="Scissors">
        <span class="emoji-icon">✌️</span>
      </button>
      <button class="choice-btn" id="rock" aria-label="Rock">
        <span class="emoji-icon">✊</span>
      </button>
    </div>

    <!-- SCOREBOARD -->
    <div class="scoreboard">
      <div class="score-box">
        <span id="user-score">0</span>
        <p>You</p>
      </div>
      <div class="score-box">
        <span id="comp-score">0</span>
        <p>Comp</p>
      </div>
    </div>

    <!-- STATUS MESSAGE BADGE -->
    <div class="status-container">
      <div id="msg" class="status-msg">Play your move</div>
    </div>

  </main>

  <script src="practice.js"></script>
</body>
</html>
