<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Home Screen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #0a0a1a;
      overflow-x: hidden;
    }

    /* ---- Home Section ---- */
    .home-section {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle at 20% 30%, #1a1a3a, #0a0a1a 80%);
    }

    /* Animated floating particles */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      background: rgba(100, 210, 255, 0.7);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 180, 255, 0.8);
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(0) translateX(0) scale(1);
        opacity: 0.2;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-120vh) translateX(40px) scale(1.3);
        opacity: 0;
      }
    }

    /* Glowing orbs behind the content */
    .glow-orb {
      position: absolute;
      width: 40vmax;
      height: 40vmax;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.3;
      animation: pulseGlow 8s ease-in-out infinite alternate;
      z-index: 0;
    }

    .orb-1 {
      background: #2a52be;
      top: -15vmax;
      left: -10vmax;
      animation-duration: 12s;
    }

    .orb-2 {
      background: #6a2cbe;
      bottom: -15vmax;
      right: -10vmax;
      animation-duration: 10s;
      animation-delay: 2s;
    }

    @keyframes pulseGlow {
      0% {
        opacity: 0.2;
        transform: scale(1);
      }
      100% {
        opacity: 0.5;
        transform: scale(1.15);
      }
    }

    /* Main content */
    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 900px;
      padding: 2rem;
      animation: fadeInUp 1.2s cubic-bezier(0.23, 1, 0.32, 1);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-content h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: white;
      text-shadow: 0 0 30px rgba(0, 180, 255, 0.5);
      margin-bottom: 0.5rem;
    }

    .hero-content h1 span {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    /* Typing effect */
    .typing-wrapper {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 400;
      color: #b0e0ff;
      margin: 1.2rem 0 2rem;
      min-height: 3.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .static-text {
      opacity: 0.9;
      color: #aad0ff;
    }

    .typed-text {
      color: #00f2fe;
      font-weight: 600;
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 1.4em;
      background: #00f2fe;
      margin-left: 4px;
      animation: blink 0.9s step-end infinite;
      vertical-align: middle;
      box-shadow: 0 0 12px #00f2fe;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* CTA Button */
    .cta-button {
      background: linear-gradient(135deg, #0066ff, #00c3ff);
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1.2rem;
      padding: 1rem 2.8rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px -8px rgba(0, 150, 255, 0.6);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      animation: buttonPulse 2.5s infinite alternate;
    }

    .cta-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.6s;
    }

    .cta-button:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 20px 40px -8px #0077ff;
    }

    .cta-button:hover::before {
      left: 100%;
    }

    .cta-button:active {
      transform: translateY(2px) scale(0.98);
    }

    @keyframes buttonPulse {
      0% {
        box-shadow: 0 10px 30px -8px rgba(0, 150, 255, 0.6);
      }
      100% {
        box-shadow: 0 15px 40px -5px rgba(0, 200, 255, 0.9);
      }
    }

    /* Floating decorative rings */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(100, 200, 255, 0.15);
      pointer-events: none;
      z-index: 2;
      animation: rotateRing 25s linear infinite;
    }

    .ring-1 {
      width: 500px;
      height: 500px;
      top: -200px;
      right: -150px;
      border-color: rgba(0, 180, 255, 0.2);
      animation-duration: 30s;
    }

    .ring-2 {
      width: 350px;
      height: 350px;
      bottom: -120px;
      left: -100px;
      border-color: rgba(150, 0, 255, 0.15);
      animation-duration: 20s;
      animation-direction: reverse;
    }

    @keyframes rotateRing {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .hero-content h1 {
        font-size: 2.5rem;
      }
      .typing-wrapper {
        font-size: 1rem;
      }
      .cta-button {
        padding: 0.9rem 1.8rem;
        font-size: 1rem;
      }
      .ring-1, .ring-2 {
        opacity: 0.5;
      }
    }
  </style>
</head>
<body>

  <section class="home-section">
    <!-- Glowing background orbs -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <!-- Decorative rotating rings -->
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>

    <!-- Floating particles generated by JS -->
    <div class="particles" id="particles"></div>

    <!-- Main hero content -->
    <div class="hero-content">
      <h1>
        Build <span>Stunning</span><br>
        Experiences
      </h1>

      <div class="typing-wrapper">
        <span class="static-text">We craft&nbsp;</span>
        <span class="typed-text" id="typed-text"></span>
        <span class="cursor"></span>
      </div>

      <button class="cta-button" id="ctaBtn">Get Started →</button>
    </div>
  </section>

  <script>
    (function() {
      // ---------- 1. Generate floating particles ----------
      const particlesContainer = document.getElementById('particles');
      const particleCount = 60;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';

        // Random size between 2 and 8 px
        const size = Math.random() * 6 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';

        // Random horizontal position
        particle.style.left = Math.random() * 100 + '%';

        // Start from below the viewport
        particle.style.bottom = -(Math.random() * 20 + 5) + '%';

        // Random animation duration between 8s and 25s
        const duration = Math.random() * 17 + 8;
        particle.style.animationDuration = duration + 's';

        // Random delay so they don't all start together
        particle.style.animationDelay = Math.random() * 10 + 's';

        // Random opacity multiplier
        particle.style.opacity = Math.random() * 0.5 + 0.3;

        // Slight blur for some particles
        if (Math.random() > 0.7) {
          particle.style.filter = 'blur(1px)';
        }

        particlesContainer.appendChild(particle);
      }

      // ---------- 2. Typing effect ----------
      const typedTextElement = document.getElementById('typed-text');
      const phrases = [
        'modern interfaces',
        'smooth animations',
        'interactive designs',
        'engaging experiences',
        'beautiful websites'
      ];
      
      let phraseIndex = 0;
      let charIndex = 0;
      let isDeleting = false;
      let currentText = '';

      function typeEffect() {
        const currentPhrase = phrases[phraseIndex];
        
        if (isDeleting) {
          // Delete character
          currentText = currentPhrase.substring(0, charIndex - 1);
          charIndex--;
        } else {
          // Add character
          currentText = currentPhrase.substring(0, charIndex + 1);
          charIndex++;
        }

        typedTextElement.textContent = currentText;

        // Determine next step
        let typeSpeed = isDeleting ? 40 : 100;

        if (!isDeleting && charIndex === currentPhrase.length) {
          // Pause at end of phrase
          typeSpeed = 2000;
          isDeleting = true;
        } else if (isDeleting && charIndex === 0) {
          isDeleting = false;
          phraseIndex = (phraseIndex + 1) % phrases.length;
          typeSpeed = 400; // pause before new phrase
        }

        setTimeout(typeEffect, typeSpeed);
      }

      // Start typing after a short delay
      setTimeout(typeEffect, 600);

      // ---------- 3. Button interaction ----------
      const ctaBtn = document.getElementById('ctaBtn');
      ctaBtn.addEventListener('click', () => {
        // Simple visual feedback and simulated action
        ctaBtn.textContent = '✨ Let\'s Go! ✨';
        ctaBtn.style.background = 'linear-gradient(135deg, #00c3ff, #0066ff)';
        
        // Reset after 1.5 seconds
        setTimeout(() => {
          ctaBtn.textContent = 'Get Started →';
          ctaBtn.style.background = 'linear-gradient(135deg, #0066ff, #00c3ff)';
        }, 1500);

        // You can add navigation or other logic here
        // alert('Welcome aboard! 🚀');
      });

      // Optional: subtle parallax effect on mouse move for hero content
      const heroContent = document.querySelector('.hero-content');
      document.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 10;
        const y = (e.clientY / window.innerHeight - 0.5) * 10;
        heroContent.style.transform = `translate(${x * 0.5}px, ${y * 0.5}px)`;
      });

      // Reset transform on mouse leave
      document.addEventListener('mouseleave', () => {
        heroContent.style.transform = 'translate(0, 0)';
      });
    })();
  </script>
</body>
</html>
