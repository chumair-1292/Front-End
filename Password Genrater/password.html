<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Password Generator</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts (Poppins) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="password.css">
</head>
<body>

  <!-- Main Container -->
  <div class="app-card">

    <!-- Title Heading -->
    <div class="heading-box">
      <h1>Generate a</h1>
      <h2 class="green-text">Random Password</h2>
      <div class="green-line"></div>
    </div>

    <!-- Input Display & Copy Icon Box -->
    <div class="display-box">
      <input type="text" id="passwordInput" placeholder="Password" readonly autocomplete="off">
      <div class="copy-icon-btn" id="copyBtn" title="Copy to Clipboard">
        <i class="fa-regular fa-copy" id="copyIcon"></i>
      </div>
    </div>

    <!-- Generate Action Button -->
    <div class="button-box">
      <button id="generateBtn">
        <i class="fa-solid fa-bolt"></i>
        <p>Generate Password</p>
      </button>
    </div>

    <!-- Copy Alert Tooltip / Notification -->
    <div class="toast-message" id="toastMessage">
      <p id="toastText">Password Copied!</p>
    </div>

  </div>

  <!-- External JavaScript -->
  <script src="password.js"></script>
</body>
</html>
