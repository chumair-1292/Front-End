<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inverted 3D Perspective Image Slider</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div class="slider-container">
    <div class="header-box">
    
      <h1>Image Slider</h1>
      <p class="subtitle">3D Curve Perspective</p>
    </div>

    <div class="scene" id="scene">
      <div class="carousel" id="carousel">
        <div class="card"><img src="https://picsum.photos/400/600?random=1" alt="Slide 1"></div>
        <div class="card"><img src="https://picsum.photos/400/600?random=2" alt="Slide 2"></div>
        <div class="card"><img src="https://picsum.photos/400/600?random=3" alt="Slide 3"></div>
        <div class="card"><img src="https://picsum.photos/400/600?random=4" alt="Slide 4"></div>
        <div class="card"><img src="https://picsum.photos/400/600?random=5" alt="Slide 5"></div>
        <div class="card"><img src="https://picsum.photos/400/600?random=6" alt="Slide 6"></div>
      </div>
    </div>

   
    <div class="dots-container" id="dotsContainer"></div>
  </div>

  <script src="java.js"></script>
</body>
</html>
