<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag and Drop App</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts (Poppins) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="dragdrop.css">
</head>
<body>

  <!-- App Main Wrapper -->
  <div class="drag-wrapper">

    <!-- Container 1 -->
    <div class="drag-container" id="container1">
      
      <div class="list-item" draggable="true">
        <i class="fa-solid fa-grip-vertical grip-icon"></i>
        <p class="item-text">List Item 1</p>
      </div>

      <div class="list-item" draggable="true">
        <i class="fa-solid fa-grip-vertical grip-icon"></i>
        <p class="item-text">List Item 2</p>
      </div>

      <div class="list-item" draggable="true">
        <i class="fa-solid fa-grip-vertical grip-icon"></i>
        <p class="item-text">List Item 3</p>
      </div>

      <div class="list-item" draggable="true">
        <i class="fa-solid fa-grip-vertical grip-icon"></i>
        <p class="item-text">List Item 4</p>
      </div>

    </div>

    <!-- Container 2 -->
    <div class="drag-container" id="container2">
      <!-- Items dropped here will automatically insert -->
    </div>

  </div>

  <!-- External JavaScript -->
  <script src="dragdrop.js"></script>
</body>
</html>
