<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RedBull Product Card Animation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <!-- Glowing background circles -->
    <div class="circle" style="--clr:#e11d48;"></div>
    <div class="circle" style="--clr:#0284c7;"></div>

    <!-- RedBull Can Image -->
    <img src="img/images__5_-removebg-preview (1).png" alt="RedBull Can" class="product-img" />

    <!-- Content Details -->
    <div class="content">
      <img src="img/images-removebg-preview.png" alt="RedBull Logo" class="logo" />
      <h2>REDBULL</h2>
      <p>
        Red Bull gives you wings! A refreshing energy drink that revitalizes body and mind.
      </p>
      <a href="#">Shop Now</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
